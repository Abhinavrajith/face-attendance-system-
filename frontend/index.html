<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Face Recognition Attendance</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      width: 500px;
      height: 500px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      top: -250px;
      right: -250px;
      animation: float 6s ease-in-out infinite;
    }

    body::after {
      content: '';
      position: fixed;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      bottom: -200px;
      left: -200px;
      animation: float 8s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(20px); }
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 25px;
      width: 100%;
      max-width: 550px;
      min-width: 320px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1;
      animation: slideIn 0.5s ease-out;
      display: flex;
      flex-direction: column;
      max-height: 95vh;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      color: #667eea;
      font-size: 1.8rem;
      margin-bottom: 8px;
      font-weight: 700;
      text-align: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    .subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 20px;
      font-size: 0.85rem;
      line-height: 1.3;
    }

    .video-container {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      margin: 15px 0;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      background: #000;
      aspect-ratio: 4/3;
      flex-shrink: 0;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      transform: scaleX(-1);
      object-fit: cover;
    }

    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border: 2px solid rgba(102, 126, 234, 0.5);
      border-radius: 12px;
      pointer-events: none;
    }

    .video-overlay::before {
      content: '';
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      bottom: 15px;
      border: 1px dashed rgba(102, 126, 234, 0.3);
      border-radius: 6px;
    }

    .status-indicator {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 6px 12px;
      border-radius: 15px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .form-section {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }

    .input-group {
      flex: 1;
    }

    .input-group label {
      display: block;
      color: #333;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.8rem;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      background: #f9fafb;
      color: #333;
      height: 42px;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: auto;
    }

    button {
      padding: 12px 8px;
      border: none;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.2;
    }

    button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    button:active::before {
      width: 300px;
      height: 300px;
    }

    .btn-register {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 3px 10px rgba(102, 126, 234, 0.4);
    }

    .btn-register:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.5);
    }

    .btn-attendance {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      box-shadow: 0 3px 10px rgba(245, 87, 108, 0.4);
    }

    .btn-attendance:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(245, 87, 108, 0.5);
    }

    .btn-download {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
      box-shadow: 0 3px 10px rgba(56, 239, 125, 0.4);
      grid-column: 1 / -1;
      height: 44px;
    }

    .btn-download:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(56, 239, 125, 0.5);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .message {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 500;
      text-align: center;
      animation: fadeIn 0.3s ease-out;
      display: none;
      flex-shrink: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.success {
      background: #d1fae5;
      color: #065f46;
      border: 2px solid #10b981;
      display: block;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
      border: 2px solid #ef4444;
      display: block;
    }

    .emoji {
      font-size: 1.2rem;
      margin-right: 5px;
    }

    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      body {
        padding: 10px;
      }
      
      .container {
        padding: 20px 15px;
        border-radius: 16px;
      }
      
      h1 {
        font-size: 1.5rem;
      }
      
      .subtitle {
        font-size: 0.75rem;
        margin-bottom: 15px;
      }
      
      .video-container {
        margin: 12px 0;
        aspect-ratio: 16/9;
      }
      
      .input-row {
        grid-template-columns: 1fr;
        gap: 10px;
        margin-bottom: 12px;
      }
      
      input {
        padding: 8px 12px;
        height: 38px;
        font-size: 0.85rem;
      }
      
      .button-group {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      
      button {
        padding: 10px 6px;
        font-size: 0.8rem;
        height: 42px;
      }
      
      .btn-download {
        height: 40px;
      }
      
      .status-indicator {
        font-size: 0.7rem;
        padding: 5px 10px;
      }
    }

    @media (max-height: 700px) {
      body {
        padding: 10px;
      }
      
      .container {
        padding: 20px;
        max-height: 96vh;
      }
      
      .video-container {
        aspect-ratio: 16/9;
      }
      
      .input-row {
        gap: 10px;
        margin-bottom: 12px;
      }
      
      input {
        padding: 8px 12px;
        height: 38px;
      }
      
      button {
        padding: 10px 8px;
        height: 42px;
      }
    }

    @media (max-height: 600px) {
      .container {
        padding: 15px;
      }
      
      h1 {
        font-size: 1.4rem;
        margin-bottom: 5px;
      }
      
      .subtitle {
        font-size: 0.7rem;
        margin-bottom: 10px;
      }
      
      .video-container {
        margin: 10px 0;
        aspect-ratio: 16/9;
      }
      
      .input-row {
        gap: 8px;
        margin-bottom: 10px;
      }
      
      input {
        padding: 6px 10px;
        height: 36px;
        font-size: 0.8rem;
      }
      
      button {
        padding: 8px 6px;
        height: 38px;
        font-size: 0.75rem;
      }
      
      .btn-download {
        height: 36px;
      }
    }

    /* Prevent any scrolling */
    html, body {
      overflow: hidden;
    }

    /* Compact mode for very small screens */
    .compact .video-container {
      aspect-ratio: 4/3;
      margin: 8px 0;
    }
    
    .compact .input-row {
      grid-template-columns: 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container" id="mainContainer">
    <h1>🎓 Smart Attendance</h1>
    <p class="subtitle">AI-Powered Face Recognition System</p>
    
    <div class="video-container">
      <video id="video" autoplay playsinline></video>
      <div class="video-overlay"></div>
      <div class="status-indicator">
        <div class="status-dot"></div>
        <span>Camera Active</span>
      </div>
    </div>

    <div class="form-section">
      <div class="input-row">
        <div class="input-group">
          <label for="name">👤 Full Name</label>
          <input id="name" type="text" placeholder="Enter name">
        </div>
        <div class="input-group">
          <label for="student_id">🎫 Student ID</label>
          <input id="student_id" type="text" placeholder="Enter ID">
        </div>
      </div>

      <div class="button-group">
        <button class="btn-register" onclick="capture('register')">
          <span>📝 Register</span>
        </button>
        <button class="btn-attendance" onclick="capture('attendance')">
          <span>✅ Mark Attendance</span>
        </button>
        <button class="btn-download" onclick="downloadExcel()">
          <span>📥 Download Excel</span>
        </button>
      </div>

      <div id="msg" class="message"></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const msgEl = document.getElementById('msg');
    const container = document.getElementById('mainContainer');
    let isProcessing = false;

    // Initialize camera with optimized settings
    navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: 'user',
        width: { ideal: 640 },
        height: { ideal: 480 }
      } 
    })
      .then(stream => {
        video.srcObject = stream;
        video.play();
      })
      .catch(err => {
        showMessage('error', '❌ Camera access denied. Please allow camera permissions.');
        console.error('Camera error:', err);
      });

    // Adjust layout based on screen size
    function adjustLayout() {
      const height = window.innerHeight;
      const width = window.innerWidth;
      
      if (height < 600 || width < 400) {
        container.classList.add('compact');
      } else {
        container.classList.remove('compact');
      }
      
      // Ensure everything fits without scrolling
      const containerHeight = container.offsetHeight;
      const viewportHeight = window.innerHeight;
      
      if (containerHeight > viewportHeight * 0.95) {
        container.style.maxHeight = (viewportHeight * 0.95) + 'px';
      } else {
        container.style.maxHeight = 'none';
      }
    }

    // Adjust on resize
    window.addEventListener('resize', adjustLayout);
    setTimeout(adjustLayout, 100);

    async function capture(mode) {
      if (isProcessing) return;

      // Validate inputs for registration
      if (mode === 'register') {
        const name = document.getElementById('name').value.trim();
        const studentId = document.getElementById('student_id').value.trim();
        
        if (!name || !studentId) {
          showMessage('error', '⚠️ Please fill in both name and student ID');
          return;
        }
      }

      isProcessing = true;
      const btn = event.target.closest('button');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span>Processing<span class="loading"></span></span>';
      btn.disabled = true;

      try {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        
        // Flip the image horizontally to match what user sees
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0);

        const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));
        const formData = new FormData();
        formData.append('photo', blob);

        let url, successMsg;
        if (mode === 'register') {
          formData.append('name', document.getElementById('name').value);
          formData.append('student_id', document.getElementById('student_id').value);
          url = 'http://127.0.0.1:8000/register';
          successMsg = '✅ User registered successfully!';
        } else {
          url = 'http://127.0.0.1:8000/mark-attendance';
          successMsg = '✅ Attendance marked successfully!';
        }

        const res = await fetch(url, { method: 'POST', body: formData });
        const data = await res.json();

        if (res.ok) {
          showMessage('success', data.message || successMsg);
          if (mode === 'register') {
            document.getElementById('name').value = '';
            document.getElementById('student_id').value = '';
          }
        } else {
          showMessage('error', '❌ ' + (data.error || 'Operation failed'));
        }
      } catch (error) {
        showMessage('error', '❌ Connection error. Please check if the server is running.');
        console.error('Error:', error);
      } finally {
        isProcessing = false;
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    function showMessage(type, text) {
      msgEl.className = 'message ' + type;
      msgEl.textContent = text;
      msgEl.style.display = 'block';
      
      setTimeout(() => {
        msgEl.style.display = 'none';
      }, 4000);
    }

    async function downloadExcel() {
      try {
        showMessage('success', '📥 Downloading...');
        
        const response = await fetch('http://127.0.0.1:8000/attendance/export');
        
        if (!response.ok) {
          throw new Error('Failed to download file');
        }
        
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'attendance.xlsx';
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        
        showMessage('success', '✅ Downloaded!');
      } catch (error) {
        showMessage('error', '❌ Failed to download. Check server.');
        console.error('Download error:', error);
      }
    }

    // Prevent accidental scrolling
    document.addEventListener('touchmove', function(e) {
      if (e.target.tagName === 'INPUT') return;
      e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
