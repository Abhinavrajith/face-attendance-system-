<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Recognition Attendance</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      top: -250px;
      right: -250px;
      animation: float 6s ease-in-out infinite;
    }

    body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      bottom: -200px;
      left: -200px;
      animation: float 8s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(20px); }
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1;
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      color: #667eea;
      font-size: 2.5rem;
      margin-bottom: 10px;
      font-weight: 700;
      text-align: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }

    .video-container {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      margin: 30px 0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      background: #000;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      transform: scaleX(-1);
    }

    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border: 3px solid rgba(102, 126, 234, 0.5);
      border-radius: 16px;
      pointer-events: none;
    }

    .video-overlay::before {
      content: '';
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      bottom: 20px;
      border: 2px dashed rgba(102, 126, 234, 0.3);
      border-radius: 8px;
    }

    .status-indicator {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .input-group {
      margin: 20px 0;
    }

    .input-group label {
      display: block;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: #f9fafb;
      color: #333;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 30px;
    }

    button {
      padding: 16px 24px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    button:active::before {
      width: 300px;
      height: 300px;
    }

    .btn-register {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-register:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }

    .btn-attendance {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
    }

    .btn-attendance:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 87, 108, 0.5);
    }

    .btn-download {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(56, 239, 125, 0.4);
      grid-column: 1 / -1;
    }

    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 239, 125, 0.5);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .message {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 500;
      text-align: center;
      animation: fadeIn 0.3s ease-out;
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.success {
      background: #d1fae5;
      color: #065f46;
      border: 2px solid #10b981;
      display: block;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
      border: 2px solid #ef4444;
      display: block;
    }

    .emoji {
      font-size: 1.5rem;
      margin-right: 8px;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 2rem;
      }

      .button-group {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎓 Smart Attendance</h1>
    <p class="subtitle">AI-Powered Face Recognition System</p>
    
    <div class="video-container">
      <video id="video" autoplay playsinline></video>
      <div class="video-overlay"></div>
      <div class="status-indicator">
        <div class="status-dot"></div>
        <span>Camera Active</span>
      </div>
    </div>

    <div class="input-group">
      <label for="name">👤 Full Name</label>
      <input id="name" type="text" placeholder="Enter your full name">
    </div>

    <div class="input-group">
      <label for="student_id">🎫 Student ID</label>
      <input id="student_id" type="text" placeholder="Enter your student ID">
    </div>

    <div class="button-group">
      <button class="btn-register" onclick="capture('register')">
        <span>📝 Register User</span>
      </button>
      <button class="btn-attendance" onclick="capture('attendance')">
        <span>✅ Mark Attendance</span>
      </button>
      <button class="btn-download" onclick="downloadExcel()">
        <span>📥 Download Attendance Excel</span>
      </button>
    </div>

    <div id="msg" class="message"></div>
  </div>

  <script>
    const video = document.getElementById('video');
    const msgEl = document.getElementById('msg');
    let isProcessing = false;

    // Initialize camera
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
      .then(stream => {
        video.srcObject = stream;
      })
      .catch(err => {
        showMessage('error', '❌ Camera access denied. Please allow camera permissions.');
        console.error('Camera error:', err);
      });

    async function capture(mode) {
      if (isProcessing) return;

      // Validate inputs for registration
      if (mode === 'register') {
        const name = document.getElementById('name').value.trim();
        const studentId = document.getElementById('student_id').value.trim();
        
        if (!name || !studentId) {
          showMessage('error', '⚠️ Please fill in both name and student ID');
          return;
        }
      }

      isProcessing = true;
      const btn = event.target.closest('button');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span>Processing<span class="loading"></span></span>';
      btn.disabled = true;

      try {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        
        // Flip the image horizontally to match what user sees
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0);

        const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.95));
        const formData = new FormData();
        formData.append('photo', blob);

        let url, successMsg;
        if (mode === 'register') {
          formData.append('name', document.getElementById('name').value);
          formData.append('student_id', document.getElementById('student_id').value);
          url = 'http://127.0.0.1:8000/register';
          successMsg = '✅ User registered successfully!';
        } else {
          url = 'http://127.0.0.1:8000/mark-attendance';
          successMsg = '✅ Attendance marked successfully!';
        }

        const res = await fetch(url, { method: 'POST', body: formData });
        const data = await res.json();

        if (res.ok) {
          showMessage('success', data.message || successMsg);
          if (mode === 'register') {
            document.getElementById('name').value = '';
            document.getElementById('student_id').value = '';
          }
        } else {
          showMessage('error', '❌ ' + (data.error || 'Operation failed'));
        }
      } catch (error) {
        showMessage('error', '❌ Connection error. Please check if the server is running.');
        console.error('Error:', error);
      } finally {
        isProcessing = false;
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    function showMessage(type, text) {
      msgEl.className = 'message ' + type;
      msgEl.textContent = text;
      msgEl.style.display = 'block';
      
      setTimeout(() => {
        msgEl.style.display = 'none';
      }, 5000);
    }

    async function downloadExcel() {
      try {
        showMessage('success', '📥 Downloading attendance report...');
        
        const response = await fetch('http://127.0.0.1:8000/attendance/export');
        
        if (!response.ok) {
          throw new Error('Failed to download file');
        }
        
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'attendance.xlsx';
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        
        showMessage('success', '✅ Attendance report downloaded successfully!');
      } catch (error) {
        showMessage('error', '❌ Failed to download attendance report. Please check if the server is running.');
        console.error('Download error:', error);
      }
    }
  </script>
</body>
</html>
